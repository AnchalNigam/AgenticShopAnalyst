[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticshop-api"
version = "0.1.0"
description = "Backend for the AgenticShop AI Business Analyst learning project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=2.0.0",
    "openai>=1.50.0",
    "psycopg[binary]>=3.2,<4.0",
    "psycopg-pool>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.setuptools.packages.find]
include = ["app*"]
