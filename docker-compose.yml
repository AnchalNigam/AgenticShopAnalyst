services:
  postgres:
    image: postgres:16-alpine
    container_name: agenticshop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenticshop}
      POSTGRES_USER: ${POSTGRES_USER:-agenticshop_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agenticshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  agenticshop_postgres_data:
    name: agenticshop_postgres_data
